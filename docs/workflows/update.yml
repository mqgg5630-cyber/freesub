name: Update Subscriptions

on:
  # 提交到当前 Arena 分支时会立即跑一次，方便先测试。
  push:
    branches:
      - arena/01a08039-freesub
  schedule:
    # 每 6 小时自动更新一次（GitHub 使用 UTC 时间）
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      node_name_suffix:
        description: '节点名称后缀，例如 mqgg'
        required: false
        default: 'mqgg'
      max_test_workers:
        description: '测活并发数，过高可能导致 Action 不稳定'
        required: false
        default: '12'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NODE_NAME_SUFFIX: ${{ github.event.inputs.node_name_suffix || github.repository_owner }}
      MAX_TEST_WORKERS: ${{ github.event.inputs.max_test_workers || '12' }}
      MAX_CLASSIFY_WORKERS: '16'
      SUB_SOURCE_URLS: ${{ vars.SUB_SOURCE_URLS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run real prober and classifier
        run: python scripts/main.py

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
          else
            git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
